name: Bug report
description: Record a reproducible defect without including sensitive business data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach live emails, passports, KYC/CDD files, contracts, credentials, private contacts, bank details, or current commercial terms.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic or sanitised data only.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Branch/version, browser, operating system, and relevant integration state.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Low - cosmetic or minor inconvenience
        - Medium - workaround exists
        - High - core work is blocked
        - Critical - security, privacy, data integrity, or availability risk
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed or replaced all sensitive and live business data.
          required: true
