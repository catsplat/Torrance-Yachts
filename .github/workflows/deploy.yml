name: Deploy approved release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment and target deployment
        required: true
        type: choice
        options: [staging, production]
      release_tag:
        description: Immutable published version, for example v0.20.0
        required: true
        type: string
      backup_confirmed:
        description: Confirm a current restorable backup exists
        required: true
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Migrate and deploy ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out the requested release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Validate approval inputs
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$BACKUP_CONFIRMED" = "true"

      - name: Verify the immutable image exists
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect requested image before migrating
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker manifest inspect "$IMAGE:$RELEASE_TAG" > requested-image-manifest.json

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Review pending production migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply reviewed migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Configure restricted SSH client
        env:
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy versioned deployment package
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp deploy/production/docker-compose.yml ops/deploy-release.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          ssh "$VPS_USER@$VPS_HOST" "rm -rf '$DEPLOY_PATH/workflows.next' && mkdir -p '$DEPLOY_PATH/workflows.next'"
          scp automation/workflows/01-core-scheduler.json \
            automation/workflows/03-readiness-monitor.json \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/workflows.next/"
          ssh "$VPS_USER@$VPS_HOST" \
            "rm -rf '$DEPLOY_PATH/workflows.previous' && if test -d '$DEPLOY_PATH/workflows'; then mv '$DEPLOY_PATH/workflows' '$DEPLOY_PATH/workflows.previous'; fi && mv '$DEPLOY_PATH/workflows.next' '$DEPLOY_PATH/workflows'"

      - name: Deploy and verify container health
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          ssh "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH' && chmod 700 deploy-release.sh && ./deploy-release.sh '$IMAGE:$RELEASE_TAG'"

      - name: Record deployment evidence
        uses: actions/upload-artifact@v6
        with:
          name: deployment-${{ inputs.environment }}-${{ inputs.release_tag }}
          path: requested-image-manifest.json
          retention-days: 90
