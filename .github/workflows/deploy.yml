name: Deploy approved release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment and target deployment
        required: true
        type: choice
        options: [staging, production]
      release_tag:
        description: Immutable published version, for example v0.20.0
        required: true
        type: string
      backup_confirmed:
        description: Confirm a current restorable backup exists
        required: true
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Migrate and deploy ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out the requested release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Record reviewed source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate approval inputs
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DEPLOYMENT_ENVIRONMENT" = "staging" || "$DEPLOYMENT_ENVIRONMENT" = "production" ]]
          test "$BACKUP_CONFIRMED" = "true"

      - name: Verify the immutable image exists
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect requested image before migrating
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="$DEPLOYMENT_ENVIRONMENT-$RELEASE_TAG"
          docker manifest inspect "$IMAGE:$IMAGE_TAG" > requested-image-manifest.json

      - name: Configure restricted SSH client
        env:
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy versioned deployment package
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test "$DEPLOY_PATH" = "/opt/torrance-yachts"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp deploy/self-hosted-cx23/docker-compose.yml \
            deploy/self-hosted-cx23/supabase-core.compose.yml \
            ops/backup/backup-production.sh \
            ops/backup/restore-to-temporal-staging.sh \
            ops/deploy-release.sh \
            ops/verify-hosted-runtime.sh \
            ops/apply-selfhosted-migrations.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          ssh "$VPS_USER@$VPS_HOST" "rm -rf '$DEPLOY_PATH/migrations.next' && mkdir -p '$DEPLOY_PATH/migrations.next'"
          scp supabase/migrations/*.sql "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/migrations.next/"
          ssh "$VPS_USER@$VPS_HOST" \
            "rm -rf '$DEPLOY_PATH/migrations.previous' && if test -d '$DEPLOY_PATH/migrations'; then mv '$DEPLOY_PATH/migrations' '$DEPLOY_PATH/migrations.previous'; fi && mv '$DEPLOY_PATH/migrations.next' '$DEPLOY_PATH/migrations' && chmod 700 '$DEPLOY_PATH/apply-selfhosted-migrations.sh' '$DEPLOY_PATH/backup-production.sh' '$DEPLOY_PATH/restore-to-temporal-staging.sh' '$DEPLOY_PATH/deploy-release.sh' '$DEPLOY_PATH/verify-hosted-runtime.sh'"

      - name: Deploy and verify container health
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          ssh "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH' && chmod 700 deploy-release.sh && ./deploy-release.sh '$IMAGE:$DEPLOYMENT_ENVIRONMENT-$RELEASE_TAG' '$DEPLOYMENT_ENVIRONMENT' '${{ steps.source.outputs.revision }}'"

      - name: Verify protected host runtime
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH' && chmod 700 verify-hosted-runtime.sh && ./verify-hosted-runtime.sh '$DEPLOYMENT_ENVIRONMENT' '$RELEASE_TAG' '${{ steps.source.outputs.revision }}'"

      - name: Record deployment evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-${{ inputs.environment }}-${{ inputs.release_tag }}
          path: requested-image-manifest.json
          retention-days: 90
