name: Build approved environment image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose browser-safe Supabase configuration is compiled into the image
        required: true
        type: choice
        options: [staging, production]
      release_tag:
        description: Existing immutable source tag, for example v0.19.1
        required: true
        type: string

concurrency:
  group: release-image-${{ inputs.environment }}-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build ${{ inputs.environment }} image for ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Validate release configuration
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DEPLOYMENT_ENVIRONMENT" = "staging" || "$DEPLOYMENT_ENVIRONMENT" = "production" ]]
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "$RELEASE_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable environment image
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="$DEPLOYMENT_ENVIRONMENT-$RELEASE_TAG"
          SOURCE_SHA=$(git rev-parse HEAD)
          docker build \
            --build-arg "DEPLOYMENT_VERSION=$RELEASE_TAG" \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" \
            --build-arg "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY" \
            --label "io.torrance.environment=$DEPLOYMENT_ENVIRONMENT" \
            --label "io.torrance.release-tag=$RELEASE_TAG" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:$DEPLOYMENT_ENVIRONMENT-sha-$SOURCE_SHA" \
            --file deploy/production/Dockerfile .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:$DEPLOYMENT_ENVIRONMENT-sha-$SOURCE_SHA"
          IMAGE_DIGEST=$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          test -n "$IMAGE_DIGEST"
          cat > release-image.json <<EOF
          {"environment":"$DEPLOYMENT_ENVIRONMENT","releaseTag":"$RELEASE_TAG","sourceRevision":"$SOURCE_SHA","imageTag":"$IMAGE:$IMAGE_TAG","imageDigest":"$IMAGE_DIGEST"}
          EOF

      - name: Publish image evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-image-${{ inputs.environment }}-${{ inputs.release_tag }}
          path: release-image.json
          retention-days: 90
