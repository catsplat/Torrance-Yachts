name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # A zero base SHA is possible on a new branch push. Treat it as a
          # full validation request rather than attempting a partial diff.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          if [[ ! -s changed-files.txt ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*|catalog/*) ;;
              *) docs_only=false; break ;;
            esac
          done < changed-files.txt

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  documentation:
    name: Documentation validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Validate documentation links and catalogue JSON
        run: npm run docs:check

  quality:
    name: Lint, typecheck, build, and audit
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm install --global npm@11.6.2 && npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations, RLS tests, and database lint
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1

      - name: Start minimal local Supabase stack
        run: supabase start -x edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector

      - name: Test database permissions and behaviour
        run: supabase test db

      - name: Lint database schema
        run: supabase db lint --local --schema public --level warning --fail-on warning

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  browser:
    name: Cross-browser acceptance
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm install --global npm@11.6.2 && npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1

      - name: Start disposable local Supabase
        # Invitation and recovery acceptance reads the isolated local Mailpit
        # inbox. It must remain enabled; nothing is sent outside the runner.
        run: supabase start -x edge-runtime,imgproxy,logflare,postgres-meta,realtime,studio,supavisor,vector

      - name: Prepare disposable browser environment
        run: node ops/e2e/prepare-local-environment.mjs

      - name: Run browser acceptance suite
        run: npm run test:e2e

      - name: Publish browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-acceptance-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup

  operations:
    name: Deployment and recovery package
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate automation workflow JSON
        run: npm run automation:validate

      - name: Validate backup tooling
        run: |
          bash -n ops/backup/backup-production.sh
          node --check ops/backup/export-storage.mjs

      - name: Validate production Compose package
        run: npm run production:validate

      - name: Validate lean CX23 self-hosted package
        run: npm run production:validate:cx23

      - name: Validate hosted VPS bootstrap package
        run: npm run host:bootstrap:validate

      - name: Verify browser/server secret boundaries
        run: npm run security:boundaries

      - name: Build and smoke-test production application image
        run: npm run production:smoke

  desktop:
    name: Windows desktop companion
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm install --global npm@11.6.2; npm ci

      - name: Restore Cargo and Tauri build cache
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: cargo-tauri-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-tauri-${{ runner.os }}-

      - name: Select the Tauri MSVC toolchain
        run: rustup default stable-msvc

      - name: Verify, compile, test and package the NSIS installer
        run: |
          npm run desktop:verify
          npm run desktop:check
          cargo test --manifest-path src-tauri/Cargo.toml
          npm run desktop:build

      - name: Publish unsigned test installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-tauri-test-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
