name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations, RLS tests, and database lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start minimal local Supabase stack
        run: supabase start -x edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector

      - name: Test database permissions and behaviour
        run: supabase test db

      - name: Lint database schema
        run: supabase db lint --local --schema public --level warning --fail-on warning

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  operations:
    name: Deployment and recovery package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate automation workflow JSON
        run: |
          for workflow in automation/workflows/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$workflow"
          done

      - name: Validate backup tooling
        run: |
          bash -n ops/backup/backup-production.sh
          node --check ops/backup/export-storage.mjs

      - name: Validate production Compose package
        env:
          ACME_EMAIL: operations@example.test
          APP_DOMAIN: operations.example.test
          N8N_DOMAIN: automation.example.test
          DEPLOYMENT_VERSION: ci
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
          SUPABASE_SECRET_KEY: synthetic-secret-key
          AUTOMATION_SHARED_SECRET: synthetic-automation-secret
          EMAIL_INGESTION_TOKEN: synthetic-ingestion-token
          MONITORING_SHARED_SECRET: synthetic-monitoring-secret
          N8N_ENCRYPTION_KEY: synthetic-n8n-encryption-key
        run: docker compose -f deploy/production/docker-compose.yml config --quiet

      - name: Build production application image
        run: |
          docker build \
            --build-arg DEPLOYMENT_VERSION=ci \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=synthetic-publishable-key \
            --tag torrance-yachts-platform:ci \
            --file deploy/production/Dockerfile \
            .
