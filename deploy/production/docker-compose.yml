services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable GHCR version tag or digest}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1024m
    cpus: 1.5
    environment:
      APP_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      DEPLOYMENT_IMAGE_ENVIRONMENT: ${DEPLOYMENT_IMAGE_ENVIRONMENT:?Set DEPLOYMENT_IMAGE_ENVIRONMENT after the release script verifies the image}
      AUTH_SMTP_CONFIGURED: ${AUTH_SMTP_CONFIGURED:-false}
      AUTOMATION_SHARED_SECRET: ${AUTOMATION_SHARED_SECRET:?Set AUTOMATION_SHARED_SECRET}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_SIGN_IN_ENABLED: ${GOOGLE_SIGN_IN_ENABLED:-false}
      INITIAL_ADMIN_SETUP_TOKEN: ${INITIAL_ADMIN_SETUP_TOKEN:-}
      MONITORING_SHARED_SECRET: ${MONITORING_SHARED_SECRET:?Set MONITORING_SHARED_SECRET}
      N8N_HEALTH_URL: ${N8N_HEALTH_URL:-http://n8n:5678/healthz}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL}
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:?Set DEPLOYMENT_VERSION}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TRUST_PROXY_HEADERS: "true"
      MFA_ENFORCEMENT_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: "10m"
    networks:
      - internal

  clamav:
    # 1.5-debian13-slim multi-architecture index, resolved 2026-08-14.
    image: clamav/clamav@sha256:8117550b0e762eeabe5376c9f6f9c6adbf1a2da50c1bc70c08ae600930817523
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    volumes:
      - clamav_data:/var/lib/clamav
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: "10m"
    networks:
      - internal

  n8n:
    # 2.30.5 multi-architecture index, resolved 2026-08-14.
    image: docker.n8n.io/n8nio/n8n@sha256:450853cd21a2ce36587c4c860eb26927c1ceba9496bf55f4c213b5d3a6dc8c6f
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 384
    mem_limit: 1024m
    cpus: 1.5
    environment:
      AUTOMATION_SHARED_SECRET: ${AUTOMATION_SHARED_SECRET:?Set AUTOMATION_SHARED_SECRET}
      GENERIC_TIMEZONE: Europe/London
      MONITORING_SHARED_SECRET: ${MONITORING_SHARED_SECRET:?Set MONITORING_SHARED_SECRET}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_EDITOR_BASE_URL: http://n8n:5678
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: n8n
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PROTOCOL: http
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      TORRANCE_APP_URL: http://app:3000
      TZ: Europe/London
      WEBHOOK_URL: http://n8n:5678
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: "10m"
    networks:
      - internal

  cloudflared:
    # 2026.7.0 multi-architecture index, resolved 2026-08-14.
    image: cloudflare/cloudflared@sha256:5e49861633763e8933475477c20bae6039ed47f32c1d267a34babc347f28f0df
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_METRICS: 0.0.0.0:2000
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: "10m"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  clamav_data:
  n8n_data:
